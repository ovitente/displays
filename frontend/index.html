<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Displays — Output manager</title>
<style>
/* Fonts vendored locally (no CDN) so the webview renders identically offline. */
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/ChakraPetch-400.woff2') format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/ChakraPetch-500.woff2') format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:600;font-display:swap;src:url('/fonts/ChakraPetch-600.woff2') format('woff2')}
@font-face{font-family:'Chakra Petch';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/ChakraPetch-700.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url('/fonts/JetBrainsMono-400.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url('/fonts/JetBrainsMono-500.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url('/fonts/JetBrainsMono-700.woff2') format('woff2')}
:root{
  --bg:#0d0e0f; --bg2:#16181a; --bg3:#1c1f22; --bg4:#23272b;
  --line:#33383d; --line2:#474d53; --ink:#dadcde; --ink2:#9aa0a6; --ink3:#6b7177;
  --accent:#f2a13c; --accent-dim:#7a5a2c;
  --good:#7fd49a; --warn:#f2c46a; --off:#6b7177; --bad:#e08c8c;
  --display:'Chakra Petch',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Every size below is in rem, so the whole UI scales by changing this one
   value — main.js sets it from the backend's DISPLAYS_SCALING. Scaling this
   way (real layout at a bigger size) keeps text crisp and native <select>
   popups anchored to the field, which a CSS zoom/transform does not. */
html{font-size:16px}
html,body{height:100%}
body{background:#070809; color:var(--ink); font-family:var(--mono); font-size:0.8125rem; line-height:1.45;
  -webkit-font-smoothing:antialiased; display:flex; align-items:stretch; justify-content:stretch; padding:0}
.disp{font-family:var(--display); text-transform:uppercase; letter-spacing:.08em}

/* ============ APP WINDOW ============ */
/* Fills the OS window and reflows on resize (the canvas grows with height). */
/* No box-shadow: .win fills the whole viewport, a shadow would be fully
   clipped — pure paint cost with zero visual effect. */
.win{width:100%; height:100vh; max-width:none; background:var(--bg); border:1px solid var(--line);
  display:flex; flex-direction:column}

/* title bar */
.titlebar{display:flex; align-items:center; gap:0.875rem; padding:0 0.875rem; height:2.875rem; background:#000;
  border-bottom:1px solid var(--line); flex:none; --wails-draggable:drag}
.brand{font-family:var(--display); font-weight:700; text-transform:uppercase; letter-spacing:.22em; font-size:0.875rem}
.brand b{color:var(--accent)}
.brand small{font-family:var(--mono); font-weight:400; text-transform:none; letter-spacing:.02em;
  font-size:0.6875rem; color:var(--ink3); margin-left:0.625rem}
.wbtns{margin-left:auto; display:flex; gap:0.5625rem; align-items:center}
.wbtns i{width:0.6875rem; height:0.6875rem; border:1px solid var(--line2); display:inline-block; border-radius:50%}

/* body */
.appbody{padding:1rem 1.125rem; display:flex; flex-direction:column; gap:0.8125rem; overflow:auto; flex:1; min-height:0;
  background:var(--bg); background-image:radial-gradient(circle,#191c1f 0.0625rem,transparent 0.0625rem); background-size:1.375rem 1.375rem}
/* Arrangement section grows; its canvas fills the leftover vertical space. */
.appbody>section:first-child{flex:1; display:flex; flex-direction:column; min-height:12.5rem}
.appbody>section:first-child .canvas{flex:1; height:auto; min-height:9.375rem}

/* section heads */
.sec-h{display:flex; align-items:center; gap:0.5625rem; margin-bottom:0.625rem}
.sec-h .dot{width:0.375rem; height:0.375rem; background:var(--accent); display:inline-block}
.sec-h .t{font-family:var(--display); text-transform:uppercase; letter-spacing:.12em; font-size:0.6875rem; color:var(--ink2)}
.sec-h .meta{margin-left:auto; font-size:0.6875rem; color:var(--ink3); letter-spacing:.04em}

/* framed brackets */
.framed{position:relative}
.framed::before,.framed::after{content:''; position:absolute; width:0.8125rem; height:0.8125rem; pointer-events:none;
  border-color:var(--line2); border-style:solid}
.framed::before{top:0;left:0;border-width:2px 0 0 2px}
.framed::after{bottom:0;right:0;border-width:0 2px 2px 0}

/* ===== ARRANGEMENT CANVAS ===== */
.canvas{position:relative; height:12.25rem; background:var(--bg2); border:1px solid var(--line);
  overflow:hidden}
/* Alpha baked into the gradient colors (--line #33383d at .22): element-level
   opacity forces a canvas-sized offscreen buffer on every paint. */
/* Grid lines stay 1px: hairlines must not scale, or they blur at fractional
   root sizes. The cell pitch does scale, so the grid tracks the UI size. */
.canvas .grid{position:absolute; inset:0; background-image:linear-gradient(rgba(51,56,61,.22) 1px,transparent 1px),
  linear-gradient(90deg,rgba(51,56,61,.22) 1px,transparent 1px);
  background-size:0.8125rem 0.8125rem}
.mon{position:absolute; border:1.5px solid var(--line2); background:var(--bg3); cursor:grab;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.1875rem; overflow:hidden;
  user-select:none; touch-action:none; transition:border-color .12s, background .12s}
.mon:hover{border-color:var(--ink3)}
.mon.drag{cursor:grabbing; z-index:6; box-shadow:0 8px 26px rgba(0,0,0,.55)}
.mon.snap{border-color:var(--accent)}
.mon.snap::after,.mon.snap::before{content:''}
.mon .mn-name{font-family:var(--display); text-transform:uppercase; letter-spacing:.08em; font-size:0.75rem; color:var(--ink)}
.mon .mn-res{font-size:0.625rem; color:var(--ink3)}
.mon.on{border-color:var(--good); background:rgba(127,212,154,.07)}
.mon.on .mn-name{color:var(--ink)}
.mon.sel{border-color:var(--accent); background:rgba(242,161,60,.10);
  box-shadow:0 0 0 1px var(--accent) inset}
.mon.off{border-style:dashed; opacity:.45}
.mon.off .mn-name{color:var(--ink3)}
.mon .pri{position:absolute; top:0.25rem; left:0.3125rem; font-family:var(--display); font-size:0.5rem; letter-spacing:.08em;
  color:var(--accent); border:1px solid var(--accent-dim); padding:0.0625rem 0.25rem; text-transform:uppercase; background:rgba(13,14,15,.5)}

/* ===== OUTPUTS LIST ===== */
.list{border:1px solid var(--line); background:var(--bg2)}
.row{display:grid; grid-template-columns:1.125rem minmax(8.75rem,1fr) 5.75rem 7.625rem 5.625rem 4.75rem 3.75rem; align-items:center; gap:0.75rem;
  padding:0.6875rem 1rem; border-bottom:1px solid var(--bg3); cursor:pointer}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg3)}
.row.sel{background:rgba(242,161,60,.07); box-shadow:inset 3px 0 0 var(--accent)}
.led{width:0.5rem; height:0.5rem; border-radius:50%; display:inline-block}
.led.good{background:var(--good); box-shadow:0 0 7px rgba(127,212,154,.6)}
.led.off{background:var(--off)}
.r-name{font-family:var(--display); text-transform:uppercase; letter-spacing:.06em; font-size:0.875rem; color:var(--ink)}
.r-name small{display:block; font-family:var(--mono); text-transform:none; letter-spacing:0; font-size:0.625rem;
  color:var(--ink3); margin-top:0.125rem}
.r-model{font-size:0.6875rem; color:var(--ink2)}
.r-pos{font-family:var(--mono); font-size:0.6875rem; color:var(--ink3); letter-spacing:.05em; white-space:nowrap}
.r-pos b{color:var(--ink2); font-weight:500}
.row.dis .r-pos b{color:var(--line2)}
.pill{display:inline-block; font-family:var(--display); font-size:0.5rem; letter-spacing:.12em; color:var(--accent);
  border:1px solid var(--accent-dim); padding:0.0625rem 0.3125rem; margin-left:0.5625rem; vertical-align:0.125rem; text-transform:uppercase;
  background:rgba(242,161,60,.08)}
.r-res{font-size:0.75rem; color:var(--ink); white-space:nowrap}
.r-res .hz{color:var(--ink3)}
.row.dis .r-name,.row.dis .r-res{color:var(--ink3)}
.row.dis .r-res .hz{color:var(--line2)}

/* switch */
.sw{width:3.75rem; height:1.625rem; border:1px solid var(--line2); background:var(--bg3); position:relative;
  cursor:pointer; flex:none; justify-self:end; user-select:none}
.sw .knob{position:absolute; top:0.125rem; left:0.125rem; width:1.625rem; height:1.25rem; background:var(--line2);
  transition:left .14s, background .14s}
.sw .txt{position:absolute; top:0; bottom:0; display:flex; align-items:center; font-family:var(--display);
  font-size:0.5625rem; letter-spacing:.08em; color:var(--ink3); pointer-events:none}
.sw .txt.l{left:0.5rem} .sw .txt.r{right:0.5rem}
.sw.on{border-color:var(--good)}
.sw.on .knob{left:2rem; background:var(--good)}
.sw.on .txt.l{color:var(--good); font-weight:700}
.sw.on .txt.r{opacity:0}
.sw:not(.on) .txt.l{opacity:0}
.sw:not(.on) .txt.r{color:var(--ink2)}

/* inline mode selects (in each output row) */
select.sel{font-family:var(--mono); font-size:0.75rem; color:var(--ink); background:var(--bg3); border:1px solid var(--line2);
  padding:0.4375rem 1.625rem 0.4375rem 0.5625rem; border-radius:2px; cursor:pointer; appearance:none; -webkit-appearance:none; width:100%;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
  background-position:calc(100% - 0.8125rem) center,calc(100% - 0.5625rem) center; background-size:0.3125rem 0.3125rem,0.3125rem 0.3125rem; background-repeat:no-repeat}
select.sel:hover{border-color:var(--ink3)}
select.sel:focus{outline:none; border-color:var(--accent)}
select.sel:disabled{cursor:default; color:var(--ink3); opacity:.5}
select.sel option{background:#1c1f22; color:var(--ink)}

/* footer */
.footer{display:flex; align-items:center; gap:0.625rem; padding:0.8125rem 1.125rem; border-top:1px solid var(--line);
  background:var(--bg2); flex:none}
.foot-note{font-size:0.6875rem; color:var(--ink3); letter-spacing:.03em}
.foot-note b{color:var(--ink2); font-weight:500}
.btn{font-family:var(--display); text-transform:uppercase; letter-spacing:.09em; font-size:0.6875rem;
  border:1px solid var(--line2); background:var(--bg3); color:var(--ink2); padding:0.5625rem 1.125rem; cursor:pointer;
  border-radius:2px; white-space:nowrap}
.btn:hover{border-color:var(--ink3); color:var(--ink)}
.btn.pri{background:var(--accent); color:#1a1206; border-color:var(--accent); font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.spacer{flex:1}

/* confirm-or-revert modal (post-Apply countdown) */
.modal{position:fixed; inset:0; background:rgba(7,8,9,.68); display:flex;
  align-items:center; justify-content:center; z-index:50}
.modal[hidden]{display:none}
.mpanel{background:var(--bg2); border:1px solid var(--line); padding:1.375rem 1.625rem; min-width:21.25rem}
.mtitle{font-size:0.8125rem; letter-spacing:.12em; color:var(--ink); margin-bottom:0.5rem}
.msub{font-size:0.75rem; color:var(--ink2); margin-bottom:1.125rem}
.msub b{color:var(--accent)}
.macts{display:flex; gap:0.625rem; justify-content:flex-end}

/* toast */
.toast{position:fixed; bottom:1.375rem; left:50%; transform:translateX(-50%) translateY(1.25rem);
  background:#000; border:1px solid var(--line2); color:var(--ink); font-size:0.75rem; letter-spacing:.04em;
  padding:0.6875rem 1.125rem; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:99}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast b{color:var(--accent)}
</style>
</head>
<body>

<div class="win framed">
  <div class="titlebar">
    <div class="brand">DIS<b>P</b>LAYS<small>output manager</small></div>
  </div>

  <div class="appbody">
    <!-- ARRANGEMENT -->
    <section>
      <div class="sec-h">
        <span class="dot"></span><span class="t">Arrangement</span>
        <span class="meta" id="arr-meta"></span>
      </div>
      <div class="canvas framed" id="canvas"><div class="grid"></div></div>
    </section>

    <!-- OUTPUTS -->
    <section>
      <div class="sec-h">
        <span class="dot"></span><span class="t">Outputs</span>
        <span class="meta" id="list-meta"></span>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>

  <div class="footer">
    <div class="foot-note" id="foot-note"></div>
    <div class="spacer"></div>
    <button class="btn" data-act="reset">Reset</button>
    <button class="btn pri" data-act="apply">Apply</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="confirm" hidden>
  <div class="mpanel framed">
    <div class="mtitle disp">Keep this configuration?</div>
    <div class="msub">Reverting in <b id="cd">10</b>s</div>
    <div class="macts">
      <button class="btn" data-mact="revert">Revert now</button>
      <button class="btn pri" data-mact="keep">Keep changes</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
